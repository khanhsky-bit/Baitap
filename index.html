    <script>
      (function() {
        // 1. Ensure window.fetch is a writable property so extensions assigning `window.fetch = ...` do not throw
        try {
          var _origFetch = window.fetch;
          try {
            Object.defineProperty(window, 'fetch', {
              value: _origFetch,
              writable: true,
              configurable: true,
              enumerable: true
            });
          } catch (_) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return _origFetch; },
              set: function(fn) { _origFetch = fn; },
              configurable: true,
              enumerable: true
            });
          }

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() { return _origFetch; },
                set: function(fn) {
                  _origFetch = fn;
                  try {
                    window.fetch = fn;
                  } catch (_) {}
                },
                configurable: true,
                enumerable: true
              });
            } catch (_) {}
          }
        } catch (_) {}

        // 2. Intercept console.error to prevent external Chrome extension injection errors from polluting logs
        try {
          var _origConsoleError = console.error;
          console.error = function() {
            var args = Array.prototype.slice.call(arguments);
            var first = args[0];
            if (
              first &&
              ((typeof first === 'string' &&
                (first.indexOf('Cannot set property fetch') !== -1 ||
                  first.indexOf('chrome-extension://') !== -1)) ||
                (first.message &&
                  first.message.indexOf('Cannot set property fetch') !== -1) ||
                (first.stack && first.stack.indexOf('chrome-extension://') !== -1))
            ) {
              return;
            }
            return _origConsoleError.apply(console, args);
          };
        } catch (_) {}

        // 3. Catch global unhandled errors originating from extensions
        window.addEventListener(
          'error',
          function(e) {
            if (
              e &&
              ((e.message && e.message.indexOf('Cannot set property fetch') !== -1) ||
                (e.filename && e.filename.indexOf('chrome-extension://') !== -1))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          },
          true
        );

        window.addEventListener(
          'unhandledrejection',
          function(e) {
            if (
              e &&
              e.reason &&
              ((e.reason.message &&
                e.reason.message.indexOf('Cannot set property fetch') !== -1) ||
                (e.reason.stack && e.reason.stack.indexOf('chrome-extension://') !== -1))
            ) {
              e.preventDefault();
              e.stopImmediatePropagation();
            }
          },
          true
        );
      })();
